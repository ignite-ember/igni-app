name: Updater E2E proof

# A throwaway proof for the E2E campaign's row R627, "the installed app
# updates itself", without Apple signing. It lives on its own branch only
# and is not meant for main.
#
# The update mechanism (poll latest.json, find a newer version, download,
# verify the minisign signature against the public key compiled into the
# build, install, relaunch) does not depend on Apple. Each leg:
#
#   1. clients/tauri/e2e/updater_builds.sh generates a THROWAWAY updater
#      key pair on the runner and builds the app twice, as version A and
#      version B, with that public key merged in by `tauri build --config`
#      (an overlay file the script writes and deletes; tauri.conf.json and
#      release.yml are untouched, and no secret is read);
#   2. clients/tauri/e2e/updater_proof.py serves latest.json and B's payload
#      over HTTPS as mirror.igni.test (a hosts entry for 127.0.0.1) with a
#      certificate from a throwaway "corporate" CA,
#      latest.json being exactly what release.yml's updater-json job would
#      publish (scripts/latest-json.mjs on the stashes the build legs would
#      upload; on Windows both the .msi and NSIS entries, so each install
#      must pick its own), installs A, points it there with `update_endpoint` in
#      ~/.igni/config.yaml (the deployment setting the shell already reads),
#      and presses the update banner's "Install & restart":
#        - the CA in no trust store → the app refuses the mirror at the
#          handshake (unknown_ca), no banner, nothing fetched, and the
#          check says it is the certificate and what to do (F13); then
#          the CA goes into the OS store (update-ca-certificates, certutil
#          Root, the System keychain) and every step below goes through it
#        - update_check_ttl: 0 → no request at all
#        - B signed by another key → refused, A stays
#        - B tampered → refused, A stays
#        - B genuine → installed, relaunched, and the app reports B
#
# Linux: the AppImage (updated in place), driven through WebDriver.
# Windows: the .msi and the NSIS setup (the plugin runs the installer,
# which relaunches the app), driven through UI Automation. macOS: the .app,
# ad-hoc signed, driven through the accessibility API (there is no
# WebDriver for WKWebView); Developer ID signing, notarization and
# Gatekeeper on the updated bundle are not provable here.
#
# The backend is the developer override on igni-core at the app's version
# (igni-core.version), so each launch reaches the chat UI, where the update
# banner lives.

on:
  push:
    branches: [ci/updater-e2e-proof]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-e2e-proof
  cancel-in-progress: true

env:
  IGNI_CORE_REF: f17a26f865db80d8f932d16629a316202a445138 # v1.0.5
  TAURI_CLI_VERSION: 2.12.6
  TAURI_DRIVER_VERSION: 2.1.0
  PYTHONUTF8: "1"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: igni-app
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-sdk
          path: igni-sdk
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-core
          ref: ${{ env.IGNI_CORE_REF }}
          path: igni-core
          persist-credentials: false

      - name: WebKitGTK, its WebDriver, a display and FUSE for the AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb dbus-x11 libfuse2 file

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: igni-core/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: The dev-override backend's venv (igni-core v1.0.5)
        working-directory: igni-core
        run: uv sync

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: igni-app/clients/web/package-lock.json

      - name: The web client's dependencies
        working-directory: igni-app/clients/web
        run: npm ci

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: igni-app/clients/tauri/src-tauri

      - name: tauri-driver
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      - name: Build A and B with a throwaway updater key
        working-directory: igni-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash clients/tauri/e2e/updater_builds.sh linux "$RUNNER_TEMP/updater-stage"

      - name: Install A, update it to B
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x1000x24" \
            uv run --python 3.12 --script igni-app/clients/tauri/e2e/updater_proof.py \
              --stage "$RUNNER_TEMP/updater-stage" \
              --kind appimage \
              --core igni-core \
              --tauri-driver "$HOME/.cargo/bin/tauri-driver" \
              --out "$GITHUB_WORKSPACE/proof" \
              --work "$RUNNER_TEMP/updater-e2e"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-e2e-linux-appimage
          path: |
            proof/
            ${{ runner.temp }}/updater-stage/manifest.json
            ${{ runner.temp }}/updater-stage/keys/
          retention-days: 30

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: igni-app
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-sdk
          path: igni-sdk
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: igni-app/clients/web/package-lock.json

      - name: The web client's dependencies
        working-directory: igni-app/clients/web
        run: npm ci

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: igni-app/clients/tauri/src-tauri

      - name: Build A and B (.msi and NSIS) with a throwaway updater key
        working-directory: igni-app
        run: bash clients/tauri/e2e/updater_builds.sh windows updater-stage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-stage-windows
          path: igni-app/updater-stage/
          retention-days: 7

  windows:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kind: [msi, nsis]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: igni-app
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-core
          ref: ${{ env.IGNI_CORE_REF }}
          path: igni-core
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: updater-stage-windows
          path: updater-stage

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: igni-core/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: The dev-override backend's venv (igni-core v1.0.5)
        working-directory: igni-core
        run: uv sync

      # No WebDriver here: msedgedriver never got a session on the app's
      # WebView2 on this runner, so the proof reads and presses the banner
      # through UI Automation.
      - name: Install A (${{ matrix.kind }}), update it to B
        run: |
          uv run --python 3.12 --script igni-app\clients\tauri\e2e\updater_proof.py `
            --stage updater-stage `
            --kind ${{ matrix.kind }} `
            --core igni-core `
            --out "$env:GITHUB_WORKSPACE\proof" `
            --work "$env:RUNNER_TEMP\updater-e2e"
          exit $LASTEXITCODE

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-e2e-windows-${{ matrix.kind }}
          path: |
            proof/
            updater-stage/manifest.json
            updater-stage/keys/
          retention-days: 30

  macos:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: igni-app
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-sdk
          path: igni-sdk
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-core
          ref: ${{ env.IGNI_CORE_REF }}
          path: igni-core
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: igni-core/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: The dev-override backend's venv (igni-core v1.0.5)
        working-directory: igni-core
        run: uv sync

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: igni-app/clients/web/package-lock.json

      - name: The web client's dependencies
        working-directory: igni-app/clients/web
        run: npm ci

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: igni-app/clients/tauri/src-tauri

      - name: Build A and B (.app, ad-hoc signed) with a throwaway updater key
        working-directory: igni-app
        run: bash clients/tauri/e2e/updater_builds.sh macos "$RUNNER_TEMP/updater-stage"

      - name: What Apple signing would change (evidence only)
        run: |
          codesign -dv --verbose=2 "$RUNNER_TEMP"/updater-stage/A/*.app 2>&1 | sed -n 1,12p || true
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP"/updater-stage/A/*.app 2>&1 || true

      - name: Install A, update it to B
        run: |
          uv run --python 3.12 --script igni-app/clients/tauri/e2e/updater_proof.py \
            --stage "$RUNNER_TEMP/updater-stage" \
            --kind app \
            --core igni-core \
            --out "$GITHUB_WORKSPACE/proof" \
            --work "$RUNNER_TEMP/updater-e2e"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-e2e-macos-app
          path: |
            proof/
            ${{ runner.temp }}/updater-stage/manifest.json
            ${{ runner.temp }}/updater-stage/keys/
          retention-days: 30
