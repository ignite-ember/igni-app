[package]
name = "igni-app"
# Kept in lockstep with ``igni-core.version`` by
# ``scripts/sync-version.mjs`` (also drives the runtime's
# ``IGNI_CORE_VERSION`` pin via ``CARGO_PKG_VERSION``).
version = "1.0.6"
description = "igni — standalone desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Background self-update channel — checks ``latest.json`` on
# GitHub Releases on startup, downloads + verifies the signed
# bundle if a newer version is available. See ``run()`` for the
# plumbing and ``release.yml`` for the publishing side.
tauri-plugin-updater = "2"
# ``igni://open?open=<page>&…`` links (``src/deep_link.rs``): the scheme
# is registered by the bundle from ``plugins.deep-link`` in
# tauri.conf.json, and on Windows and Linux, where a followed link starts
# a second process, single-instance hands it to the running app.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Verifying the organisation's signed group pack (``src/group_pack/``):
# RS256 and SHA-256 from ``ring``, base64url from ``base64``. Both were
# already in the build through rustls/ureq, so neither adds a crate.
ring = "0.17"
base64 = "0.23"

# ── The cloud relay (see ``src/cloud/``) ───────────────────────────
# Windows reach a person's cloud igni through a loopback relay in this
# process, which dials the Fleet gateway with the desktop's session token
# so the token never enters the webview. All of these were already in
# the build through Tauri, its updater and ureq: tokio is Tauri's
# runtime, rustls (with ring) and the platform verifier come with the
# updater's HTTP client, so the relay trusts the same roots the system
# does, enterprise CAs included. tokio-tungstenite is the WebSocket
# handshake and framing, without its own connector: the relay opens the
# TCP and TLS itself so it can honour HTTPS_PROXY.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The extension page origins in cloud mode (``src/cloud/pages.rs``): an
# HTTP/1 client to the gateway's page route over the relay's own TCP and
# TLS. hyper, hyper-util and http-body-util were already in the build
# through the updater's HTTP client.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# ── Bootstrap runtime (see ``src/runtime.rs``) ─────────────────────
# Sync HTTP client — ``ureq`` pulls in a fraction of what ``reqwest``
# does and we don't need async for a serial download → install
# pipeline. ``rustls`` rather than the system-openssl backend so the
# install is hermetic on Linux distros that ship with old OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Tar + gzip for the macOS / Linux uv release archives.
flate2 = "1"
tar = "0.4"
# Cross-platform per-user cache dir (``~/Library/Caches`` on mac,
# ``$XDG_CACHE_HOME`` on linux, ``%LOCALAPPDATA%`` on windows).
dirs = "7"
# Free-space check before bootstrap so we fail fast on a full disk
# instead of mid-pip-install.
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Native NSWindow access for repositioning the traffic-light
# cluster after navigation events that reset it back to the OS
# default. Builder-time ``traffic_light_position`` doesn't survive
# ``location.href`` navigations on macOS Big Sur+.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
# CFRunLoopObserver — fires after every main-thread layout pass so
# we can immediately undo AppKit's reset of the traffic-light
# cluster. Background polling can't outrun the reset; a runloop
# observer runs *after* AppKit's title-bar layout each iteration.
core-foundation-sys = "0.8"
# Unlock the WKWebView internal 60 Hz render cap so ProMotion
# displays actually paint at their native refresh rate (up to
# 120 Hz on M-series MacBooks / Studio Displays). WKWebView caps
# to 60 by default regardless of the display's ``maximumFramesPerSecond``;
# this plugin flips the private ``_setPreferredFramesPerSecond``
# knob after the WebView is instantiated. Effective on macOS
# 12+, no-op on displays that top out at 60 Hz anyway.
tauri-plugin-macos-fps = "0.1"

[target.'cfg(unix)'.dependencies]
# ``kill(pid, 0)`` — the liveness half of backend discovery. A
# lockfile naming a dead PID has to be recognised as stale, or the
# app attaches to a port nothing is serving. See ``src/discovery.rs``.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# uv ships its Windows release as a .zip. Tar.gz on every other
# platform — see ``runtime::extract_uv``.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The Windows uv extraction is plain logic over a .zip; its tests build a
# zip and run on every platform, so a zip API change cannot again break
# only the Windows build, which no other CI job compiles.
zip = { version = "9", default-features = false, features = ["deflate"] }
# ``tauri::test``'s mock runtime, so the update tests drive ``AppUpdater``
# and the real updater plugin without a webview; it also lets a test build
# a real app and real window and ask what a listener of a given kind hears
# (``events.rs``: Tauri matches the kind of an address exactly, so a
# listener of one kind never hears an address of another). Adds no crate.
tauri = { version = "2", features = ["test"] }

[lib]
name = "igni_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
