<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>igni</title>
<style>
  /*
    First-launch loading view shown while the Tauri shell does the
    one-time uv + Python + igni-core bootstrap. Rust emits
    ``igni-bootstrap-progress`` Tauri events with short status
    strings; we render the latest one. When the BE is ready the
    Rust side navigates this window to the real app URL, so this
    page only ever lives during the first ~2-3 min of first launch
    (sub-100ms thereafter on cached installs).
  */
  :root {
    color-scheme: light dark;
    --bg: #faf9f5;
    --fg: #1f1e1c;
    --fg-muted: #6b6a64;
    --accent: #F26A1B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624;
      --fg: #f0efea;
      --fg-muted: #87857d;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .igni-loading-shell {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 22px;
  }
  .igni-loading-flame {
    width: 64px;
    height: 64px;
    animation: flicker 2.4s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { transform: translateY(0) scale(1);    opacity: 1;   }
    50%      { transform: translateY(-2px) scale(1.04); opacity: 0.85; }
  }
  .igni-loading-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .igni-loading-status {
    font-size: 14px;
    color: var(--fg-muted);
    min-height: 1.4em;
    /* Slight delay before the spinner-style fade so quick
       state transitions don't visually flicker.        */
    transition: opacity 0.18s ease;
  }
  /* Determinate progress bar — each Rust ``progress()`` string
     maps to a known stage; the bar advances stepwise. Long
     download stages also get a shimmer overlay so the user
     sees motion even while bytes are still flowing. */
  .igni-loading-progress {
    width: 320px;
    height: 4px;
    background: rgba(127, 127, 127, 0.18);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .igni-loading-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #F26A1B 0%, #F59E0B 100%);
    border-radius: 2px;
    transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  /* Subtle shimmer overlay — only enabled while a long download
     stage is active. Tells the user "still working" when the
     bar isn't moving for a while. */
  .igni-loading-progress.shimmer .igni-loading-progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.35) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%);  }
  }
  .igni-loading-step {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--fg-muted);
    opacity: 0.65;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    min-height: 1.2em;
  }
  .igni-loading-hint {
    font-size: 12px;
    color: var(--fg-muted);
    max-width: 480px;
    text-align: center;
    line-height: 1.5;
    margin-top: 12px;
    opacity: 0.7;
  }
  .igni-loading-error {
    color: #d04a4a;
    font-size: 13px;
    max-width: 600px;
    padding: 16px;
    white-space: pre-wrap;
    text-align: left;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>
<div class="igni-loading-shell">
  <svg class="igni-loading-flame" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="15" fill="#D98457"/>
    <path fill="#fff" fill-rule="evenodd" transform="translate(32 33) scale(.8) translate(-32 -32)" d="M35 3C31 12 13 23 13 40a19 19 0 0 0 38 0c0-8-3.5-14-8-19c-.5 5-3 8.5-7 9.5c3-8 2-19-1-27.5Z M32 33c-3 4-7.5 7.5-7.5 12.5a7.5 7.5 0 0 0 15 0c0-5-4.5-8.5-7.5-12.5Z"/>
  </svg>
  <div class="igni-loading-title">igni</div>
  <div class="igni-loading-status" id="status">Starting up…</div>
  <div class="igni-loading-progress" id="progress-bar">
    <div class="igni-loading-progress-fill" id="progress-fill"></div>
  </div>
  <div class="igni-loading-step" id="step"></div>
  <div class="igni-loading-hint" id="hint">
    First launch downloads uv, Python, igni-core and igni's decision model (about 2 GB). Subsequent launches start instantly.
  </div>
</div>
<script>
(function () {
  // ``?msg=…`` honours an initial status set by the Rust side
  // (used by Reinstall Backend so the user doesn't see a stale
  // "Starting up…" while the wipe runs).
  const params = new URLSearchParams(location.search);
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");
  const fill = document.getElementById("progress-fill");
  const bar = document.getElementById("progress-bar");
  const stepLabel = document.getElementById("step");
  if (params.get("msg")) status.textContent = params.get("msg");

  // Each entry maps a regex against the Rust ``progress()`` string
  // (see ``runtime.rs`` and ``lib.rs::bootstrap_and_open``) onto a
  // stage index. The bar fills to ``(stage / total) * 100``. Stages
  // marked ``download: true`` get a shimmer overlay so the user
  // sees motion even though bytes-level progress isn't reported
  // (would require a Rust streaming-read change to surface).
  //
  // Order must match the actual bootstrap sequence. ``Refreshing
  // managed venv…`` only fires on the Reinstall path and replaces
  // the uv-download stage, so they share a slot.
  const STAGES = [
    // Each pattern matches the shell's own message (runtime/managed.rs,
    // backend/process.rs); src/loadingStages.test.ts holds the two in step.
    // After the rename these still looked for the package's and the
    // model's old names, so the bar stopped at step 4 for the whole
    // igni-core install and the 1.7 GB model download.
    { re: /preparing.*backend/i,         download: false },
    { re: /(downloading uv|refreshing.*venv)/i, download: true  },
    { re: /installing python/i,          download: true  },
    { re: /creating.*venv/i,             download: false },
    { re: /(installing|updating) igni-core/i, download: true },
    { re: /decision model/i,             download: true  },
    { re: /starting.*backend/i,          download: false },
  ];
  const TOTAL = STAGES.length;
  let currentStage = 0;

  function applyStatus(text) {
    status.textContent = text;
    // Match against the known stage list. We only advance forward
    // — a later message arriving before an earlier one (rare race
    // on event delivery) doesn't snap the bar backwards.
    for (let i = 0; i < TOTAL; i++) {
      if (STAGES[i].re.test(text) && i + 1 > currentStage) {
        currentStage = i + 1;
        fill.style.width = ((currentStage / TOTAL) * 100).toFixed(1) + "%";
        stepLabel.textContent = "Step " + currentStage + " of " + TOTAL;
        if (STAGES[i].download) bar.classList.add("shimmer");
        else bar.classList.remove("shimmer");
        break;
      }
    }
    // Hide the long-form hint once we're past the visible
    // bootstrap stages — keeps the screen quiet during the
    // ~3 s "Starting the igni backend…" tail.
    if (STAGES[TOTAL - 1].re.test(text)) hint.style.opacity = "0";
  }

  // The Tauri global is injected by the shell. Subscribe to the
  // progress channel as soon as it's available. If the page is
  // loaded directly in a non-Tauri context (web preview), the
  // listener never fires — the page just shows "Starting up…".
  let shownError = false;
  function showError(message) {
    // Once: the event, the catch-up and the shell's own eval may all carry it.
    if (shownError || document.querySelector(".igni-loading-error")) return;
    shownError = true;
    status.textContent = "";
    stepLabel.textContent = "";
    // Stop the shimmer and recolor the bar red so the
    // visible state matches the error message.
    bar.classList.remove("shimmer");
    fill.style.background = "#d04a4a";
    const node = document.createElement("div");
    node.className = "igni-loading-error";
    node.textContent = "Bootstrap failed:\n\n" + message;
    document.querySelector(".igni-loading-shell").appendChild(node);
  }

  function attach() {
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen("igni-bootstrap-progress", e => {
        if (typeof e.payload === "string") applyStatus(e.payload);
      });
      window.__TAURI__.event.listen("igni-bootstrap-error", e => {
        if (typeof e.payload === "string") showError(e.payload);
      });
      // What happened before this page was listening: an instant failure
      // (air-gapped with no runtime) is emitted before WebView2 has even
      // loaded the page, and was lost — the page sat on "Starting up…".
      if (window.__TAURI__.core && window.__TAURI__.core.invoke) {
        window.__TAURI__.core.invoke("igni_bootstrap_state").then(state => {
          if (state && typeof state.progress === "string") applyStatus(state.progress);
          if (state && typeof state.error === "string") showError(state.error);
        }, () => {});
      }
      return true;
    }
    return false;
  }
  if (!attach()) {
    // Tauri injects the global slightly after page parse; poll
    // briefly so we don't miss the first events.
    const t = setInterval(() => { if (attach()) clearInterval(t); }, 50);
    setTimeout(() => clearInterval(t), 5000);
  }
})();
</script>
</body>
</html>
